openapi: 3.0.3

info:
  title: Cinema Booking API
  version: 1.0.0

paths:
  /api/movies:
    get:
      operationId: getMovies
      tags:
        - Movies
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieResponse'

    post:
      operationId: createMovie
      tags:
        - Movies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'

  /api/movies/{id}:
    get:
      operationId: getMovieById
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    patch:
      operationId: updateMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    delete:
      operationId: deleteMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Movie deleted
        '404':
          description: Movie not found

components:
  schemas:

    MovieResponse:
      type: object
      required:
        - id
        - title
        - duration
        - age_rating
        - description
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        duration:
          type: integer
        age_rating:
          type: string
        description:
          type: string
          minLength: 1

    CreateMovieRequest:
      type: object
      required:
        - title
        - duration
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string

    UpdateMovieRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string