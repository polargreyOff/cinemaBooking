openapi: 3.0.3

info:
  title: Cinema Booking API
  version: 1.0.0

paths:
  /api/bookings:
    post:
      tags:
        - Bookings
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: Session or seat not found
        '409':
          description: Seat already booked

  /api/bookings/my:
    get:
      tags:
        - Bookings
      operationId: getMyBookings
      responses:
        '200':
          description: Current user bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'

  /api/bookings/{id}:
    get:
      tags:
        - Bookings
      operationId: getBookingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '403':
          description: Booking belongs to another user
        '404':
          description: Booking not found

    delete:
      tags:
        - Bookings
      operationId: cancelBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Booking cancelled
        '403':
          description: Booking belongs to another user
        '404':
          description: Booking not found
  /api/sessions:
    get:
      tags:
        - Sessions
      operationId: getSessions
      parameters:
        - name: movieTitle
          in: query
          required: false
          schema:
            type: string

        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - startTime
              - price
              - movieTitle
            default: startTime

        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc

      responses:
        '200':
          description: Page of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPageResponse'

    post:
      tags:
        - Sessions
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid session data
        '404':
          description: Movie or hall not found

  /api/sessions/{id}:
    get:
      tags:
        - Sessions
      operationId: getSessionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Session not found

    delete:
      tags:
        - Sessions
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session not found
  /api/sessions/{sessionId}/seats:
    get:
      tags:
        - Sessions
      operationId: getSessionSeats
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Seats with availability for session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSeatResponse'

        '404':
          description: Session not found

  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      responses:
        '204':
          description: Successfully logged out
        '403':
          description: Invalid or missing CSRF token
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid login or password
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid registration data
        '409':
          description: Login already exists

  /api/halls/{hallId}/seats/generate:
    post:
      tags:
        - Seats
      operationId: generateSeats
      parameters:
        - name: hallId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSeatsRequest'

      responses:
        '201':
          description: Seats generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'

        '400':
          description: Invalid generation parameters

        '404':
          description: Hall not found

        '409':
          description: Some seats already exist

  /api/halls/{hallId}/seats:
    get:
      tags:
        - Seats
      operationId: getSeatsByHall
      parameters:
        - name: hallId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of seats in hall
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'
        '404':
          description: Hall not found

    post:
      tags:
        - Seats
      operationId: createSeat
      parameters:
        - name: hallId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatRequest'
      responses:
        '201':
          description: Seat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '400':
          description: Invalid seat data
        '404':
          description: Hall not found
        '409':
          description: Seat already exists

  /api/seats/{id}:
    get:
      tags:
        - Seats
      operationId: getSeatById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Seat found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '404':
          description: Seat not found
    delete:
      tags:
        - Seats
      operationId: deleteSeat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Seat deleted
        '404':
          description: Seat not found
  /api/halls:
    get:
      tags:
        - Halls
      operationId: getHalls
      responses:
        '200':
          description: List of halls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HallResponse'

    post:
      tags:
        - Halls
      operationId: createHall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHallRequest'
      responses:
        '201':
          description: Hall created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '400':
          description: Invalid hall data

  /api/halls/{id}:
    get:
      tags:
        - Halls
      operationId: getHallById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hall found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '404':
          description: Hall not found

    patch:
      tags:
        - Halls
      operationId: updateHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHallRequest'
      responses:
        '200':
          description: Hall updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '400':
          description: Invalid hall data
        '404':
          description: Hall not found

    delete:
      tags:
        - Halls
      operationId: deleteHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Hall deleted
        '404':
          description: Hall not found
  /api/movies:
    get:
      operationId: getMovies
      tags:
        - Movies
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieResponse'

    post:
      operationId: createMovie
      tags:
        - Movies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'

  /api/movies/{id}:
    get:
      operationId: getMovieById
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    patch:
      operationId: updateMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    delete:
      operationId: deleteMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Movie deleted
        '404':
          description: Movie not found

components:
  schemas:
    SessionSeatResponse:
      type: object
      required:
        - id
        - rowNumber
        - seatNumber
        - available
      properties:
        id:
          type: integer
          format: int64

        rowNumber:
          type: integer

        seatNumber:
          type: integer

        available:
          type: boolean
    CreateBookingRequest:
      type: object
      required:
        - sessionId
        - seatId
      properties:
        sessionId:
          type: integer
          format: int64
        seatId:
          type: integer
          format: int64

    BookingResponse:
      type: object
      required:
        - id
        - session
        - seat
        - bookingTime
      properties:
        id:
          type: integer
          format: int64

        session:
          $ref: '#/components/schemas/SessionResponse'

        seat:
          $ref: '#/components/schemas/SeatResponse'

        bookingTime:
          type: string
          format: date-time

    SessionResponse:
      type: object
      required:
        - id
        - movie
        - hall
        - startTime
        - price
        - endTime
      properties:
        id:
          type: integer
          format: int64

        movie:
          $ref: '#/components/schemas/MovieResponse'

        hall:
          $ref:  '#/components/schemas/HallResponse'

        startTime:
          type: string
          format: date-time

        price:
          type: integer
        endTime:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      required:
        - movieId
        - hallId
        - startTime
        - price
      properties:
        movieId:
          type: integer
          format: int64

        hallId:
          type: integer
          format: int64

        startTime:
          type: string
          format: date-time

        price:
          type: integer
          minimum: 1

    SessionPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer
          format: int64

        totalPages:
          type: integer

    MovieResponse:
      type: object
      required:
        - id
        - title
        - duration
        - age_rating
        - description
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        duration:
          type: integer
        age_rating:
          type: string
        description:
          type: string
          minLength: 1

    CreateMovieRequest:
      type: object
      required:
        - title
        - duration
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string

    UpdateMovieRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string
    HallResponse:
      type: object
      required:
        - id
        - number
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          minimum: 1

    CreateHallRequest:
      type: object
      required:
        - number
      properties:
        number:
          type: integer
          minimum: 1

    UpdateHallRequest:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
    SeatResponse:
      type: object
      required:
        - id
        - hallId
        - rowNumber
        - seatNumber
      properties:
        id:
          type: integer
          format: int64
        hallId:
          type: integer
          format: int64
        rowNumber:
          type: integer
          minimum: 1
        seatNumber:
          type: integer
          minimum: 1

    GenerateSeatsRequest:
      type: object
      required:
        - rows
        - seatsPerRow
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 100

        seatsPerRow:
          type: integer
          minimum: 1
          maximum: 100

    CreateSeatRequest:
      type: object
      required:
        - rowNumber
        - seatNumber
      properties:
        rowNumber:
          type: integer
          minimum: 1
        seatNumber:
          type: integer
          minimum: 1
    RegisterRequest:
      type: object
      required:
        - name
        - login
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        login:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-zA-Z0-9_]+$'
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        phone:
          type: string
          maxLength: 30

    UserResponse:
      type: object
      required:
        - id
        - name
        - login
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        login:
          type: string
        phone:
          type: string
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password