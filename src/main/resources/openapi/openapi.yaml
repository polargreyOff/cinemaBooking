openapi: 3.0.3

info:
  title: Cinema Booking API
  version: 1.0.0

paths:
  /api/halls/{hallId}/seats:
    get:
      tags:
        - Seats
      operationId: getSeatsByHall
      parameters:
        - name: hallId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of seats in hall
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'
        '404':
          description: Hall not found

    post:
      tags:
        - Seats
      operationId: createSeat
      parameters:
        - name: hallId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatRequest'
      responses:
        '201':
          description: Seat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '400':
          description: Invalid seat data
        '404':
          description: Hall not found
        '409':
          description: Seat already exists

  /api/seats/{id}:
    get:
      tags:
        - Seats
      operationId: getSeatById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Seat found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '404':
          description: Seat not found
    delete:
      tags:
        - Seats
      operationId: deleteSeat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Seat deleted
        '404':
          description: Seat not found
  /api/halls:
    get:
      tags:
        - Halls
      operationId: getHalls
      responses:
        '200':
          description: List of halls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HallResponse'

    post:
      tags:
        - Halls
      operationId: createHall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHallRequest'
      responses:
        '201':
          description: Hall created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '400':
          description: Invalid hall data

  /api/halls/{id}:
    get:
      tags:
        - Halls
      operationId: getHallById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hall found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '404':
          description: Hall not found

    patch:
      tags:
        - Halls
      operationId: updateHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHallRequest'
      responses:
        '200':
          description: Hall updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallResponse'
        '400':
          description: Invalid hall data
        '404':
          description: Hall not found

    delete:
      tags:
        - Halls
      operationId: deleteHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Hall deleted
        '404':
          description: Hall not found
  /api/movies:
    get:
      operationId: getMovies
      tags:
        - Movies
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieResponse'

    post:
      operationId: createMovie
      tags:
        - Movies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'

  /api/movies/{id}:
    get:
      operationId: getMovieById
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    patch:
      operationId: updateMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Movie not found

    delete:
      operationId: deleteMovie
      tags:
        - Movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Movie deleted
        '404':
          description: Movie not found

components:
  schemas:

    MovieResponse:
      type: object
      required:
        - id
        - title
        - duration
        - age_rating
        - description
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        duration:
          type: integer
        age_rating:
          type: string
        description:
          type: string
          minLength: 1

    CreateMovieRequest:
      type: object
      required:
        - title
        - duration
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string

    UpdateMovieRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
        age_rating:
          type: string
    HallResponse:
      type: object
      required:
        - id
        - number
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          minimum: 1

    CreateHallRequest:
      type: object
      required:
        - number
      properties:
        number:
          type: integer
          minimum: 1

    UpdateHallRequest:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
    SeatResponse:
      type: object
      required:
        - id
        - hallId
        - rowNumber
        - seatNumber
      properties:
        id:
          type: integer
          format: int64
        hallId:
          type: integer
          format: int64
        rowNumber:
          type: integer
          minimum: 1
        seatNumber:
          type: integer
          minimum: 1

    CreateSeatRequest:
      type: object
      required:
        - rowNumber
        - seatNumber
      properties:
        rowNumber:
          type: integer
          minimum: 1
        seatNumber:
          type: integer
          minimum: 1