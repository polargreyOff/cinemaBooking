plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.25.0'
}

group = 'gradle.example.com'
version = '0.0.1-SNAPSHOT'
description = 'cinema-booking'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
}

openApiGenerate {
    generatorName = "spring"

    inputSpec = "$rootDir/src/main/resources/openapi/openapi.yaml"

    outputDir = "$buildDir/generated/openapi"

    apiPackage = "gradle.example.com.cinemabooking.generated.api"
    modelPackage = "gradle.example.com.cinemabooking.generated.model"

    configOptions = [
            interfaceOnly     : "true",
            useSpringBoot4    : "true",
            useResponseEntity : "true",
            useTags           : "true",
            openApiNullable: "false"
    ]
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/openapi/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.named("openApiGenerate")

tasks.named('test') {
    useJUnitPlatform()
}